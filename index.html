<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Push-Up Pro: Manual Calibration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        #container { position: relative; width: 100vw; max-width: 640px; aspect-ratio: 4/3; background: #111; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .ui-panel { width: 100%; max-width: 640px; padding: 20px; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; border-radius: 0 0 20px 20px; box-sizing: border-box; }
        .stats-row { display: flex; width: 100%; justify-content: space-around; align-items: center; }
        .stat-value { font-size: 48px; font-weight: 800; color: #00ff88; }
        #timer { color: #ff4444; }
        
        #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; }
        #status { font-size: 16px; color: #ffcc00; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .controls { display: flex; gap: 10px; width: 100%; justify-content: center; }
        button { padding: 15px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        
        #calibBtn { background: #6f42c1; color: white; width: 180px; }
        #calibBtn.active { background: #dc3545; animation: pulse 1s infinite; }
        #startBtn { background: #007bff; color: white; display: none; width: 180px; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" playsinline muted></video>
        <canvas id="output"></canvas>
        <div id="overlay"></div>
    </div>

    <div class="ui-panel">
        <div id="status">WAITING FOR CAMERA...</div>
        
        <div id="setupUI" class="controls">
            <button id="calibBtn" onclick="toggleCalibration()">START CALIBRATION</button>
            <button id="startBtn" onclick="beginWorkoutCountdown()">START CHALLENGE</button>
        </div>

        <div id="workoutUI" class="stats-row hidden">
            <div style="text-align:center"><div id="timer" class="stat-value">60</div><div style="font-size:10px; color:#888;">SECONDS</div></div>
            <div style="text-align:center"><div id="counter" class="stat-value">0</div><div style="font-size:10px; color:#888;">REPS</div></div>
        </div>
    </div>

    <script>
        let detector, video, canvas, ctx;
        let count = 0, timeLeft = 60, isRunning = false;
        let upLineY = null, downLineY = null;
        let isCalibrating = false;
        let tempMinY = 9999, tempMaxY = 0;
        let stage = "up";

        async function init() {
            video = document.getElementById('video');
            canvas = document.getElementById('output');
            ctx = canvas.getContext('2d');

            detector = await poseDetection.createDetector(
                poseDetection.SupportedModels.MoveNet,
                { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
            );

            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                document.getElementById('status').innerText = "READY";
                run();
            };
        }

        function toggleCalibration() {
            const btn = document.getElementById('calibBtn');
            if (!isCalibrating) {
                // Start Recording
                isCalibrating = true;
                tempMinY = 9999; tempMaxY = 0;
                btn.innerText = "STOP & SAVE";
                btn.classList.add('active');
                document.getElementById('status').innerText = "DO A FULL REPETITION NOW";
                document.getElementById('startBtn').style.display = "none";
            } else {
                // Stop Recording
                isCalibrating = false;
                btn.innerText = "RE-CALIBRATE";
                btn.classList.remove('active');
                
                // Add a small 10% buffer to the detected range
                const range = tempMaxY - tempMinY;
                upLineY = tempMinY + (range * 0.1);
                downLineY = tempMaxY - (range * 0.1);
                
                document.getElementById('startBtn').style.display = "block";
                document.getElementById('status').innerText = "CALIBRATION SAVED";
            }
        }

        function beginWorkoutCountdown() {
            document.getElementById('setupUI').classList.add('hidden');
            let readyTime = 5;
            const overlay = document.getElementById('overlay');
            document.getElementById('status').innerText = "PREPARE!";
            
            const countInterval = setInterval(() => {
                overlay.innerText = readyTime;
                readyTime--;
                if (readyTime < 0) {
                    clearInterval(countInterval);
                    overlay.innerText = "";
                    startActualWorkout();
                }
            }, 1000);
        }

        function startActualWorkout() {
            isRunning = true;
            count = 0;
            timeLeft = 60;
            document.getElementById('workoutUI').classList.remove('hidden');
            document.getElementById('status').innerText = "GO GO GO!";
            
            const workoutTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(workoutTimer);
                    isRunning = false;
                    document.getElementById('status').innerText = "WORKOUT COMPLETE";
                    document.getElementById('status').style.color = "#00ff88";
                }
            }, 1000);
        }

        async function run() {
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (upLineY && downLineY) drawLines();

            if (poses.length > 0) {
                const kp = poses[0].keypoints;
                const lS = kp.find(k => k.name === 'left_shoulder');
                const rS = kp.find(k => k.name === 'right_shoulder');

                if (lS.score > 0.4 && rS.score > 0.4) {
                    const shoulderY = (lS.y + rS.y) / 2;

                    if (isCalibrating) {
                        if (shoulderY < tempMinY) tempMinY = shoulderY;
                        if (shoulderY > tempMaxY) tempMaxY = shoulderY;
                    }

                    if (isRunning) {
                        if (shoulderY > downLineY && stage === "up") {
                            stage = "down";
                            document.getElementById('status').innerText = "PUSH UP!";
                        }
                        if (shoulderY < upLineY && stage === "down") {
                            stage = "up";
                            count++;
                            document.getElementById('counter').innerText = count;
                            document.getElementById('status').innerText = "LOWER DOWN";
                        }
                    }
                    
                    // Tracking indicator
                    ctx.fillStyle = isCalibrating ? "#6f42c1" : "#00ff88";
                    ctx.beginPath(); ctx.arc((lS.x + rS.x)/2, shoulderY, 10, 0, 2 * Math.PI); ctx.fill();
                }
            }
            requestAnimationFrame(run);
        }

        function drawLines() {
            ctx.lineWidth = 4;
            // Up Phase Line
            ctx.strokeStyle = "rgba(0, 191, 255, 0.6)";
            ctx.setLineDash([10, 5]);
            ctx.beginPath(); ctx.moveTo(0, upLineY); ctx.lineTo(canvas.width, upLineY); ctx.stroke();
            
            // Down Phase Line
            ctx.strokeStyle = "rgba(255, 68, 68, 0.6)";
            ctx.setLineDash([]);
            ctx.beginPath(); ctx.moveTo(0, downLineY); ctx.lineTo(canvas.width, downLineY); ctx.stroke();
        }

        init();
    </script>
</body>
</html>
